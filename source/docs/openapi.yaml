openapi: 3.0.3
info: {title: API REST de Libros y Autores, version: 1.0.0}
servers:
- {url: /api}
tags:
- {name: Estado}
- {name: Autores}
- {name: Publicaciones}
paths:
  /health:
    get:
      tags: [Estado]
      summary: Comprobar estado de la API
      responses:
        '200': {$ref: '#/components/responses/Estado'}
  /authors:
    get:
      tags: [Autores]
      summary: Obtener lista de autores
      responses:
        '200': {$ref: '#/components/responses/Autores'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Autores]
      summary: Crear un nuevo autor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAuthorDTO'}
      responses:
        '201': {$ref: '#/components/responses/AutorCreado'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /authors/{id}:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Autores]
      summary: Obtener autor por ID
      responses:
        '200': {$ref: '#/components/responses/Autor'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [Autores]
      summary: Actualizar datos de un autor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAuthorDTO'}
      responses:
        '200': {$ref: '#/components/responses/Autor'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Autores]
      summary: Eliminar autor
      responses:
        '200': {$ref: '#/components/responses/Eliminado'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /authors/{id}/posts:
    get:
      tags: [Autores]
      summary: Listar publicaciones de un autor
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {$ref: '#/components/responses/Publicaciones'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /posts:
    get:
      tags: [Publicaciones]
      summary: Listar publicaciones con filtros y paginación
      parameters:
      - name: author_id
        in: query
        description: Filtrar por identificador de autor
        schema: {type: integer, example: 1}
      - name: published
        in: query
        description: Filtrar por estado de publicación (true o false)
        schema: {type: boolean, example: true}
      - name: limit
        in: query
        description: Cantidad máxima de registros a retornar (1 a 100)
        schema: {type: integer, minimum: 1, maximum: 100, example: 10}
      - name: page
        in: query
        description: Número de página para la paginación (inicia en 1)
        schema: {type: integer, minimum: 1, default: 1, example: 1}
      responses:
        '200': {$ref: '#/components/responses/Publicaciones'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Publicaciones]
      summary: Crear una nueva publicación
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePostDTO'}
      responses:
        '201': {$ref: '#/components/responses/PublicacionCreado'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/ServerError'}
  /posts/{id}:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Publicaciones]
      summary: Obtener publicación por ID
      responses:
        '200': {$ref: '#/components/responses/Publicacion'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [Publicaciones]
      summary: Actualizar una publicación
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePostDTO'}
      responses:
        '200': {$ref: '#/components/responses/Publicacion'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Publicaciones]
      summary: Eliminar una publicación
      responses:
        '200': {$ref: '#/components/responses/Eliminado'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
components:
  schemas:
    Author:
      type: object
      properties:
        id: {type: integer, example: 1}
        name: {type: string, example: George Orwell}
        email: {type: string, format: email, example: george.orwell@example.com}
        bio: {type: string, nullable: true, example: 'Novelista, ensayista y crítico británico.'}
        created_at: {type: string, format: date-time, example: '2026-07-28T00:17:56.936Z'}
      required: [id, name, email, created_at]
    CreateAuthorDTO:
      type: object
      properties:
        name: {type: string, example: Gabriel García Márquez}
        email: {type: string, format: email, example: gabo@example.com}
        bio: {type: string, example: 'Escritor y periodista colombiano, premio Nobel de Literatura.', nullable: true}
      required: [name, email]
    UpdateAuthorDTO:
      type: object
      properties:
        name: {type: string, example: Jane Austen}
        email: {type: string, format: email, example: jane.austen@example.com}
        bio: {type: string, example: Destacada novelista británica del siglo XIX., nullable: true}
      minProperties: 1
    Post:
      type: object
      properties:
        id: {type: integer, example: 1}
        author_id: {type: integer, example: 1}
        title: {type: string, example: '1984'}
        content: {type: string, example: Una novela de ciencia ficción distópica y sátira política.}
        published: {type: boolean, example: true}
        created_at: {type: string, format: date-time, example: '2026-07-28T00:17:56.936Z'}
        author_name: {type: string, example: George Orwell}
        author_email: {type: string, format: email, example: george.orwell@example.com}
      required: [id, author_id, title, content, published, created_at]
    CreatePostDTO:
      type: object
      properties:
        author_id: {type: integer, example: 1}
        title: {type: string, example: Rebelión en la granja}
        content: {type: string, example: Fábula alegórica que narra la historia de los animales de una granja.}
        published: {type: boolean, default: false, example: true}
      required: [author_id, title, content]
    UpdatePostDTO:
      type: object
      properties:
        author_id: {type: integer, example: 1}
        title: {type: string, example: 1984 (Edición Revisada)}
        content: {type: string, example: Contenido actualizado de la novela.}
        published: {type: boolean, example: true}
      minProperties: 1
    ErrorResponse:
      type: object
      properties:
        error: {type: string, example: Mensaje descriptivo del error}
        detail: {type: string, example: Información adicional del sistema o base de datos}
    SuccessMessage:
      type: object
      properties:
        message: {type: string, example: Operación realizada con éxito}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1, example: 1}
  responses:
    BadRequest:
      description: Datos o identificador inválidos
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Email ya registrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Estado:
      description: Estado
      content:
        application/json:
          schema:
            type: object
            properties:
              status: {type: string, example: ok}
              message: {type: string, example: API funcionando correctamente}
    Autores:
      description: Autores
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/Author'}
    AutorCreado:
      description: AutorCreado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Author'}
    Autor:
      description: Autor
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Author'}
    Eliminado:
      description: Eliminado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessMessage'}
    Publicaciones:
      description: Publicaciones
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/Post'}
    PublicacionCreado:
      description: PublicacionCreado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Post'}
    Publicacion:
      description: Publicacion
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Post'}
